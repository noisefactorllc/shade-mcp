# Blocking quality gate for shade-mcp.
#
# ci.yml is the shared template used across repos: its test step is
# continue-on-error by design, so dependency bumps auto-merge on
# install + lint + build. That policy is deliberate and stays.
#
# This workflow is additive and repo-specific: shade-mcp's unit tests need no
# browser and run in about a second, so there is no reason for them to be
# advisory here. It also runs the typecheck, which nothing else does — vitest
# does not typecheck, so a suite can be fully green while tsc is failing.
name: quality

on:
  pull_request:
    paths-ignore:
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/FUNDING.yml'
      - '.github/CODEOWNERS'
      - '.editorconfig'
      - 'docs/**'
  push:
    paths-ignore:
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/FUNDING.yml'
      - '.github/CODEOWNERS'
      - '.editorconfig'
      - 'docs/**'
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # --ignore-scripts skips the prepare build; typecheck and the unit tests
      # both read src/ directly and do not need dist/.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # The unit suite mocks Playwright, so it cannot tell whether the browser
  # tools actually work — a wrong viewer root made every one of them time out
  # while the whole suite stayed green. This drives the built server against a
  # real viewer instead.
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # noisemaker supplies the viewer page and the effects library. It is
      # public, so no token is needed, and everything the page imports is
      # tracked — a plain checkout is enough.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: noisefactorllc/noisemaker
          ref: cb22a05eff9afed99fcf22a482b944c26f43e814
          path: noisemaker

      # The authored composition fixture and codec are shared with Portable.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: noisefactorllc/portable
          ref: fc4da6f802ba9ba7b61c2371b7997a57bcd9b21a
          path: portable

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # Scripts run here, unlike the job above: prepare builds dist/, and the
      # smoke test drives the built server.
      - name: Install and build
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tools smoke test
        env:
          NOISEMAKER: ${{ github.workspace }}/noisemaker
          # Runners have no GPU, so Chromium needs its software rasterizer.
          SHADE_SWIFTSHADER: '1'
        run: node scripts/browser-smoke.mjs

      - name: Authored Portable DSL smoke test
        env:
          NOISEMAKER: ${{ github.workspace }}/noisemaker
          PORTABLE: ${{ github.workspace }}/portable
          SHADE_SWIFTSHADER: '1'
        run: node scripts/authored-dsl-smoke.mjs

      - name: Shader-craft library parity
        env:
          NOISEMAKER: ${{ github.workspace }}/noisemaker
          SHADE_SWIFTSHADER: '1'
        run: node scripts/craft-library-parity.mjs

      - name: Shader-craft example parity
        env:
          NOISEMAKER: ${{ github.workspace }}/noisemaker
          SHADE_SWIFTSHADER: '1'
        run: node scripts/craft-examples-parity.mjs --software --out "${{ runner.temp }}/craft-examples"

  # Every release is vendored into noisemaker by its pull-shade-mcp workflow,
  # which lands the drop only after noisemaker's scripts/test-shade-mcp passes.
  # This runs the same checks on this build against noisemaker's current main,
  # so a release that would fail there is caught before it is tagged:
  # release.yml requires this workflow to pass on the tagged commit.
  noisemaker:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: noisefactorllc/noisemaker
          path: noisemaker

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            noisemaker/package-lock.json

      # The same tarball release.yml publishes.
      - name: Build the release tarball
        run: |
          npm ci
          tar -czf "$RUNNER_TEMP/shade-mcp-dist.tar.gz" -C dist .

      - name: Vendor the build into noisemaker
        working-directory: noisemaker
        env:
          SHADE_MCP_TARBALL: ${{ runner.temp }}/shade-mcp-dist.tar.gz
        run: python3 pull-shade-mcp

      - name: Install noisemaker
        working-directory: noisemaker
        run: |
          npm ci
          npx playwright install chromium

      - name: Run noisemaker's drop tests
        working-directory: noisemaker
        run: scripts/test-shade-mcp
