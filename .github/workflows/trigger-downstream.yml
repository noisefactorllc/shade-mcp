# Tell the consumers (noisemaker, portable, shade) to vendor a published
# shade-mcp release. release.yml calls this once the release is published;
# workflow_dispatch sends a tag again.
name: Trigger Downstream Updates

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to dispatch (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  trigger-downstream:
    runs-on: ubuntu-latest
    steps:
      - name: Check the release asset is published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -qx 'shade-mcp-dist.tar.gz'; then
            echo "::error::release $TAG has no shade-mcp-dist.tar.gz asset"
            exit 1
          fi
          echo "Release $TAG is published with its asset."

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liVHXh37ZQ13M67k
          private-key: ${{ secrets.NOISEDECK_APP_PRIVATE_KEY }}
          owner: noisefactorllc

      - name: Trigger noisemaker
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: noisefactorllc/noisemaker
          event-type: shade-mcp-updated
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "tag": "${{ inputs.tag }}"}'

      - name: Trigger portable
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: noisefactorllc/portable
          event-type: shade-mcp-updated
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "tag": "${{ inputs.tag }}"}'

      - name: Trigger shade
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: noisefactorllc/shade
          event-type: shade-mcp-updated
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "tag": "${{ inputs.tag }}"}'
